[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "OFL-1.1",
  "EUPL-1.2",
  # Liste des autorités de certification (webpki-root-certs), donnée sous licence permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
ignore = [
  # proc-macro-error n'est plus maintenu (RUSTSEC-2024-0370) : tiré par GTK via Tauri, sans
  # vulnérabilité connue ni remplacement côté Cahutin.
  { id = "RUSTSEC-2024-0370", reason = "dépendance de Tauri/GTK, pas de CVE" },
]
