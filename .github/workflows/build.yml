# Construction : tests à chaque envoi sur main. Les installeurs Windows (NSIS, utilisateur courant, et MSIX du Store)
# et Linux (AppImage, .deb) ne se construisent que pour un tag vX.Y.Z, ou à la demande (« Run workflow » sur GitHub) :
# ils sont alors publiés en artefacts. Un tag publie en plus une version GitHub avec les installeurs, leurs empreintes
# (SHA256SUMS, signées ensuite par scripts/sign-release.sh) et la section de CHANGELOG.md.
name: Construction

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Le jeton du workflow ne fait que lire le dépôt ; seule la publication d'une release écrit (voir le job).
permissions:
  contents: read

# Un run à la fois par branche ou tag. Sur main, un nouvel envoi annule le run en cours : seul le dernier état compte
# (le cache Rust reste celui du dernier run réussi). Un tag, lui, va toujours jusqu'au bout.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Avant les constructions : le tag doit être la version de l'application et avoir ses notes.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version et notes de la release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, version $version dans Cargo.toml"; exit 1; }
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::pas de section « ## $version » dans CHANGELOG.md"; exit 1; }

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notes
          path: notes.md

  windows:
    needs: notes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      # En release, sans l'optimisation des paquets distribués : rapide.
      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      # Export PDF avec le vrai WebView2 : chaque feuille au format de sa page (src-tauri/tests/pdf_windows_probe.rs).
      # Sans runtime WebView2 sur le runner, le banc est sauté avec un avertissement.
      - name: Banc de l'export PDF (WebView2)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id"
          )
          $pv = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $pv) {
            Write-Output "::warning::Runtime WebView2 absent du runner : banc de l'export PDF non lancé."
            exit 0
          }
          Write-Output "Runtime WebView2 $pv"
          cargo test -p carnet-app --release --test pdf_windows_probe -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installeur
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          # Paquet distribué : optimisation à l'édition de liens et un seul bloc de génération.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: npm run tauri build

      - name: Publier l'installeur
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cahutin-installeur-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Microsoft Store : la même application, sans avis de nouvelle version (le Store met à jour), en
      # paquet MSIX que le Store signe. L'identité vient des variables du dépôt (Partner Center) ; sans
      # elles, une identité d'essai vérifie seulement que le paquet se construit.
      - name: Application pour le Store
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          CAHUTIN_STORE: "1"
          # Paquet distribué : optimisation à l'édition de liens et un seul bloc de génération.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: npm run tauri build -- --no-bundle

      - name: Paquet MSIX
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >-
          scripts/build-msix.ps1
          -Name "${{ vars.STORE_IDENTITY_NAME || 'Cahutin.Essai' }}"
          -Publisher "${{ vars.STORE_PUBLISHER || 'CN=Essai' }}"
          -PublisherDisplay "${{ vars.STORE_PUBLISHER_DISPLAY || 'Essai' }}"

      - name: Publier le paquet MSIX
        if: vars.STORE_IDENTITY_NAME != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cahutin-msix-${{ github.sha }}
          path: target/msix/*.msix
          if-no-files-found: error
          retention-days: 90

  # Ubuntu 22.04 : une glibc ancienne, pour que l'AppImage fonctionne sur la plupart des distributions.
  linux:
    needs: notes
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      # Licences, sources et avis de sécurité des dépendances (deny.toml).
      - name: Dépendances (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # tauri.conf.json ne vise que NSIS (installeur Windows) : les paquets Linux sont demandés ici.
      - name: Paquets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          # Paquet distribué : optimisation à l'édition de liens et un seul bloc de génération.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: npm run tauri build -- --bundles appimage,deb

      - name: Publier les paquets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cahutin-linux-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # Banc de fidélité ODG (README, Développement) : les pages exportées, rendues par LibreOffice, comparées
  # à l'écran. À part, pour ne pas ralentir les installeurs. LibreOffice vient d'apt, plus ancienne que
  # celle du poste de développement : sa version est écrite dans le journal.
  odg:
    needs: notes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Les paquets de LibreOffice (85 Mo) se téléchargeaient en 6 minutes : ils sont gardés en cache, sous une clé
      # faite de leurs versions, pour qu'une mise à jour d'Ubuntu en télécharge seulement les nouveaux.
      - name: Versions de LibreOffice Draw et poppler
        id: lo
        run: |
          sudo apt-get update
          echo "key=$(apt-cache policy libreoffice-draw poppler-utils | grep Candidate | tr -d ' ' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Paquets de LibreOffice en cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: libreoffice-ubuntu-24.04-${{ steps.lo.outputs.key }}
          restore-keys: libreoffice-ubuntu-24.04-

      - name: LibreOffice Draw et poppler
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" libreoffice-draw poppler-utils
          # Le cache est enregistré par l'utilisateur du runner : les paquets téléchargés par apt lui reviennent.
          sudo chown -R "$USER" ~/apt-archives
          soffice --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Banc de fidélité ODG
        run: cargo test -p carnet-core --test odg_libreoffice -- --ignored --test-threads=1

  # Avant la 1.0, le titre porte « (bêta) » ; la version n'est pas marquée préversion, pour que
  # « releases/latest » (liens du README, avis de nouvelle version) la trouve.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Les paquets Linux arrivent dans des sous-dossiers (appimage/, deb/) : on les cherche par leur nom.
          files=()
          for name in "Cahutin_${version}_x64-setup.exe" "Cahutin_${version}_amd64.AppImage" "Cahutin_${version}_amd64.deb"; do
            f=$(find dist -type f -name "$name" | head -1)
            test -n "$f" || { echo "::error::$name introuvable"; find dist -type f; exit 1; }
            files+=("$f")
          done
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          cat SHA256SUMS
          cp "$(find dist -type f -name notes.md | head -1)" notes.md
          printf '\n---\n\nEmpreintes : `SHA256SUMS` (signature GPG `SHA256SUMS.asc`). Code signing policy : https://e-ban.github.io/cahutin/signature.html\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Cahutin $version (bêta)" --notes-file notes.md
