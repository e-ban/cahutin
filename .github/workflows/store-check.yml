# Vérifier l'accès au Microsoft Store : connexion avec les secrets de l'application Entra ID, puis lecture
# de la fiche de Cahutin et de l'état de sa dernière soumission. N'envoie rien. À lancer à la main
# (onglet Actions) après avoir réglé les secrets, avant la première version envoyée automatiquement.
name: Vérifier l'accès au Store

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Outil du Microsoft Store
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Connexion à Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Fiche et dernière soumission
        shell: pwsh
        run: |
          msstore apps get "${{ vars.STORE_PRODUCT_ID || '9P1VD877KD19' }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Accès refusé : vérifier les secrets et le rôle Manager"; exit $LASTEXITCODE }
          msstore submission status "${{ vars.STORE_PRODUCT_ID || '9P1VD877KD19' }}"
