[package]
name = "carnet-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "carnet_app"

[[bin]]
name = "cahutin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
carnet-core = { path = "../crates/carnet-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "win-system-proxy"] }
open = "5.4.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
