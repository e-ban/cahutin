# Construction Windows : tests, puis installeur NSIS (utilisateur courant) publié en artefact.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      # En release : l'installeur réutilise ensuite la plupart des dépendances compilées ici.
      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      - name: Installeur
        run: npm run tauri build

      - name: Publier l'installeur
        uses: actions/upload-artifact@v7
        with:
          name: carnet-installeur-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
