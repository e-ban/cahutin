# Construction : tests, puis installeurs Windows (NSIS, utilisateur courant) et Linux (AppImage, .deb)
# publiés en artefacts. Un tag vX.Y.Z publie en plus une version GitHub avec les installeurs, leurs
# empreintes (SHA256SUMS, signées ensuite par scripts/sign-release.sh) et la section de CHANGELOG.md.
name: Construction

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Un run à la fois : un nouvel envoi attend la fin du run en cours au lieu de l'annuler (le cache
# Rust n'est enregistré qu'à la fin d'un run réussi). GitHub ne garde que le dernier run en attente.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Avant les constructions : le tag doit être la version de l'application et avoir ses notes.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version et notes de la release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, version $version dans Cargo.toml"; exit 1; }
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::pas de section « ## $version » dans CHANGELOG.md"; exit 1; }

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  windows:
    needs: notes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      # En release : l'installeur réutilise ensuite la plupart des dépendances compilées ici.
      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      - name: Installeur
        run: npm run tauri build

      - name: Publier l'installeur
        uses: actions/upload-artifact@v7
        with:
          name: cahutin-installeur-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Microsoft Store : la même application, sans avis de nouvelle version (le Store met à jour), en
      # paquet MSIX que le Store signe. L'identité vient des variables du dépôt (Partner Center) ; sans
      # elles, une identité d'essai vérifie seulement que le paquet se construit.
      - name: Application pour le Store
        env:
          CAHUTIN_STORE: "1"
        run: npm run tauri build -- --no-bundle

      - name: Paquet MSIX
        shell: pwsh
        run: >-
          scripts/build-msix.ps1
          -Name "${{ vars.STORE_IDENTITY_NAME || 'Cahutin.Essai' }}"
          -Publisher "${{ vars.STORE_PUBLISHER || 'CN=Essai' }}"
          -PublisherDisplay "${{ vars.STORE_PUBLISHER_DISPLAY || 'Essai' }}"

      - name: Publier le paquet MSIX
        if: vars.STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: cahutin-msix-${{ github.sha }}
          path: target/msix/*.msix
          if-no-files-found: error
          retention-days: 90

  # Ubuntu 22.04 : une glibc ancienne, pour que l'AppImage fonctionne sur la plupart des distributions.
  linux:
    needs: notes
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      # tauri.conf.json ne vise que NSIS (installeur Windows) : les paquets Linux sont demandés ici.
      - name: Paquets
        run: npm run tauri build -- --bundles appimage,deb

      - name: Publier les paquets
        uses: actions/upload-artifact@v7
        with:
          name: cahutin-linux-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # Avant la 1.0, le titre porte « (bêta) » ; la version n'est pas marquée préversion, pour que
  # « releases/latest » (liens du README, avis de nouvelle version) la trouve.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Les paquets Linux arrivent dans des sous-dossiers (appimage/, deb/) : on les cherche par leur nom.
          files=()
          for name in "Cahutin_${version}_x64-setup.exe" "Cahutin_${version}_amd64.AppImage" "Cahutin_${version}_amd64.deb"; do
            f=$(find dist -type f -name "$name" | head -1)
            test -n "$f" || { echo "::error::$name introuvable"; find dist -type f; exit 1; }
            files+=("$f")
          done
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          cat SHA256SUMS
          cp "$(find dist -type f -name notes.md | head -1)" notes.md
          printf '\n---\n\nEmpreintes : `SHA256SUMS` (signature GPG `SHA256SUMS.asc`). Code signing policy : https://e-ban.github.io/cahutin/signature.html\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Cahutin $version (bêta)" --notes-file notes.md

  # Microsoft Store : le paquet MSIX de la version est envoyé et soumis à la certification, sans passer
  # par Partner Center. Interrupteur : la variable du dépôt STORE_PRODUCT_ID (9P1VD877KD19). Il faut
  # aussi les secrets de l'application Entra ID associée au compte Partner Center (rôle Manager) :
  # STORE_TENANT_ID, STORE_SELLER_ID, STORE_CLIENT_ID, STORE_CLIENT_SECRET. Une soumission déjà en cours
  # de certification bloque l'envoi : la tâche échoue alors, sans rien changer dans le Store.
  store:
    if: startsWith(github.ref, 'refs/tags/v') && vars.STORE_PRODUCT_ID != ''
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cahutin-msix-${{ github.sha }}
          path: msix

      - name: Outil du Microsoft Store
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Connexion à Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Envoyer la version au Store
        shell: pwsh
        run: |
          $msix = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          if (-not $msix) { Write-Error "Paquet MSIX introuvable"; exit 1 }
          msstore publish $msix.FullName --appId "${{ vars.STORE_PRODUCT_ID }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Envoi au Store refusé"; exit $LASTEXITCODE }
          msstore submission status "${{ vars.STORE_PRODUCT_ID }}"
