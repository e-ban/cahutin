[package]
name = "carnet-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ts-rs = "11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
roxmltree = "0.20"
tempfile = "3"
tract-onnx = "0.23"
ttf-parser = "0.25"
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }
# Date de prise de vue des photos de la photothèque, lue avant que l'import retire les métadonnées.
kamadak-exif = "0.6"
# Tracés d'un PDF importé (courbes, polygones) redessinés en image fixe.
tiny-skia = "0.11"
svgtypes = "0.15"

[dev-dependencies]
