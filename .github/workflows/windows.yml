# Construction Windows : tests, puis installeur NSIS (utilisateur courant) publié en artefact.
# Un tag vX.Y.Z publie en plus une release GitHub avec l'installeur et sa section de CHANGELOG.md.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Un run à la fois : un nouvel envoi attend la fin du run en cours au lieu de l'annuler (le cache
# Rust n'est enregistré qu'à la fin d'un run réussi). GitHub ne garde que le dernier run en attente.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Avant la construction : le tag doit être la version de l'application et avoir ses notes.
      - name: Version et notes de la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # La copie Windows a des fins de ligne CRLF.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, version $version dans Cargo.toml"; exit 1; }
          tr -d '\r' < CHANGELOG.md | awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' > notes.md
          grep -q . notes.md || { echo "::error::pas de section « ## $version » dans CHANGELOG.md"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances de l'interface
        run: npm ci

      - name: Tests de l'interface
        run: npm test

      # En release : l'installeur réutilise ensuite la plupart des dépendances compilées ici.
      - name: Tests du moteur et de l'application
        run: cargo test --workspace --release

      - name: Installeur
        run: npm run tauri build

      - name: Publier l'installeur
        uses: actions/upload-artifact@v7
        with:
          name: carnet-installeur-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Avant la 1.0 et la recette avec les collègues, les versions sont des préversions.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          exe="target/release/bundle/nsis/Carnet_${version}_x64-setup.exe"
          test -f "$exe" || { echo "::error::$exe introuvable"; ls target/release/bundle/nsis; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$exe" --title "Carnet $version" --notes-file notes.md --prerelease
