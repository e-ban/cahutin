[workspace]
resolver = "3"
members = ["crates/carnet-core", "crates/cahutin-mcp", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.16.0"
license = "EUPL-1.2"

# Symboles retirés. L'optimisation à l'édition de liens et le bloc de génération unique ne s'appliquent
# qu'aux paquets distribués (variables CARGO_PROFILE_RELEASE_* des étapes de construction de la CI) : sur
# les tests en release, elles faisaient passer la CI Windows de 4 à plus de 35 minutes.
[profile.release]
strip = true

# Le traitement d'images est très lent sans optimisation : seules ces bibliothèques sont optimisées
# en développement (optimiser toutes les dépendances rendait la compilation très longue).
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

# Repérage des visages (tract) : sans optimisation, plusieurs secondes par photo en développement.
[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-hir]
opt-level = 3

[profile.dev.package.tract-onnx]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3
