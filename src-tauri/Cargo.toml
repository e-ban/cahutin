[package]
name = "carnet-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "carnet_app"

[[bin]]
name = "cahutin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
carnet-core = { path = "../crates/carnet-core" }
cahutin-mcp = { path = "../crates/cahutin-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "win-system-proxy"] }
open = "5.4.5"
trash = "5"
# Export PDF sous Windows : le PDF de la voie DevTools arrive en base64 (déjà dans Cargo.lock).
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Impression sous Linux : pré-réglage du dialogue (papier, orientation), versions déjà tirées par wry.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

# Banc de l'export PDF (tests/pdf_windows_probe.rs) : fenêtre cachée et COM, sans Tauri.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
